<style>
    /* --- СТИЛИ ШАПКИ --- */
    .header-card {
        min-height: 200px;
        background: rgba(15, 10, 10, 0.6);
        padding: 25px;
    }
    .header-content {
        position: relative; z-index: 4;
        display: flex; flex-direction: row; align-items: center;
        justify-content: flex-start;
        padding-left: 0;
        gap: 40px; width: 100%;
    }
    .header-col-logo {
        flex: 0 0 32%;
        display: flex; justify-content: flex-end; align-items: center;
    }
    .logo-link { display: block; transition: transform 0.3s; }
    .logo-link:hover { transform: scale(1.05); }

    .main-logo-img {
        max-width: 270px; height: auto; object-fit: contain;
        filter: drop-shadow(0 0 20px rgba(255, 0, 0, 0.25));
        transition: filter 0.3s ease;
    }
    .logo-link:hover .main-logo-img {
        filter:
                drop-shadow(0 0 5px rgba(255, 255, 255, 0.8))
                drop-shadow(0 0 15px rgba(255, 100, 0, 0.6))
                drop-shadow(0 0 30px rgba(255, 0, 0, 0.4));
    }

    .header-col-text { text-align: center; flex: 1; }

    /* Контейнер: Заголовок + Партнерская группа */
    .title-row {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 10px;
    }

    .logo-text {
        font-size: 2.5rem;
        font-weight: 900;
        letter-spacing: -1px;
        text-shadow: 0 0 30px rgba(255, 0, 0, 0.3);
        line-height: 1;
        margin: 0;
    }

    /* Обертка для & и Логотипа */
    .partner-group { display: flex; align-items: center; gap: 6px; }

    /* ССЫЛКА НА СТРОЙПЛОЩАДКУ */
    .sp-link { display: block; text-decoration: none; transition: transform 0.3s ease; }
    .sp-logo-img { height: 60px; width: auto; object-fit: contain; display: block; transition: filter 0.3s ease; }
    .sp-link:hover { transform: translateY(-2px) scale(1.05); }
    .sp-link:hover .sp-logo-img { filter: drop-shadow(0 0 10px #FFEE00); }

    .red-text { color: var(--accent); transition: text-shadow 0.3s ease; }
    .desc { max-width: 650px; color: var(--text-muted); line-height: 1.4; font-size: 1.1rem; margin: 0 auto; }

    /* --- ЭФФЕКТЫ ЛОГОТИПА --- */
    .logo-link-text {
        color: inherit;
        text-decoration: none;
        display: inline-block;
        transition: transform 0.3s ease, text-shadow 0.3s ease, opacity 0.3s;
        /* --- ИСПРАВЛЕНИЕ: ЗАПРЕТ ПЕРЕНОСА СТРОКИ --- */
        white-space: nowrap;
    }
    .logo-link-text:hover {
        transform: scale(1.05); opacity: 1;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.5);
    }
    .logo-link-text:hover .red-text {
        text-shadow: 0 0 10px rgba(255, 0, 0, 1), 0 0 25px rgba(255, 0, 0, 0.8);
    }

    /* --- ЦИФРА 59 (НАД ТОЧКОЙ) --- */
    .dot-wrapper {
        position: relative;
        display: inline-block;
    }

    .sup-59 {
        font-size: 0.45em; /* Размер цифры */
        position: absolute;

        /* Центрируем относительно точки */
        left: 50%;
        transform: translateX(-50%);

        /* Начальная позиция */
        top: 0.1em;

        color: #fff;
        opacity: 0;

        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        pointer-events: none;
    }

    /* При наведении: цифра взлетает выше (-0.8em), чтобы выглядеть как степень */
    .logo-link-text:hover .sup-59 {
        opacity: 1;
        top: -0.2em;
        text-shadow: 0 0 10px rgba(255,255,255,0.8);
    }

    /* --- АДАПТИВНОСТЬ --- */
    @media (max-width: 900px) {
        .header-card { min-height: auto; padding: 30px 15px; display: flex; flex-direction: column; }
        .header-content { flex-direction: column; gap: 0; padding-left: 0; justify-content: flex-start; align-items: center; height: auto; }
        .header-col-logo { flex: 0 0 auto; width: 100%; justify-content: center; margin-bottom: 0; }
        .main-logo-img { max-width: 270px; display: block; }
        .header-col-text { width: 100%; margin-top: -25px; position: relative; flex: auto; }

        /* На мобильном разрешаем перенос партнеров на новую строку, но НЕ текста логотипа */
        .title-row { justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-bottom: 5px; }

        .logo-text { font-size: 1.4rem; }
        .sp-logo-img { height: 28px; }
        .desc br { display: inline; }
        .desc { width: 100%; display: block; font-size: 0.9rem; white-space: normal; text-align: right; opacity: 0.8; margin-top: 5px; line-height: 1.3; }
    }
</style>

<div class="card header-card">
    <div class="header-content">
        <div class="header-col-logo">
            <a href="index.html" class="logo-link">
                <img src="site/img/logo.png" alt="JanPro Logo" class="main-logo-img">
            </a>
        </div>
        <div class="header-col-text">

            <div class="title-row">
                <h1 class="logo-text">
                    <a href="https://www.youtube.com/@jan.pro59." target="_blank" class="logo-link-text">
                        JanPro<span class="red-text"><span class="dot-wrapper">.<span class="sup-59">59</span></span>ru</span>
                    </a>
                </h1>

                <div class="partner-group">
                    <a href="https://www.youtube.com/@stroyploschadka" target="_blank" class="sp-link">
                        <img src="site/img/sp2.png" alt="Стройплощадка" class="sp-logo-img">
                    </a>
                </div>
            </div>

            <p class="desc">Профессиональная сборка электрощитов<br>для квартир и частных домов.</p>
        </div>
    </div>
</div>
