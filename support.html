<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Техподдержка | JanPro.ru</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="site/styles.css">
    <link rel="icon" type="image/x-icon" href="site/favicon.ico" />
    <script src="site/metrics.js"></script>

    <style>
        /* --- СТИЛЬ ВЕРХНЕГО БЛОКА (ИНФО + ПРОЖЕКТОР) --- */
        .sup-card {
            background: rgba(15, 10, 10, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(40px);
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 20px;
            position: relative; /* Важно для прожектора */
            overflow: hidden;   /* Важно для прожектора */
        }

        /* ЭФФЕКТ ПРОЖЕКТОРА (::before) - Общий для карточки и кнопок */
        .sup-card::before,
        .action-card-contact::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(800px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255, 255, 255, 0.08), transparent 40%);
            z-index: 0;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .sup-card:hover::before,
        .action-card-contact:hover::before {
            opacity: 1;
        }

        /* Контент внутри карточки поверх прожектора */
        .sup-content-inner {
            position: relative;
            z-index: 1;
            display: flex; flex-direction: column; align-items: center; width: 100%;
        }

        .sup-title-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
            width: 100%;
        }

        .sup-main-icon {
            width: 50px; height: 50px; opacity: 0.9; flex-shrink: 0;
        }

        .sup-title {
            font-size: 1.8rem; font-weight: 700; color: #fff; margin: 0; line-height: 1.2; text-align: left;
        }

        .sup-text {
            font-size: 1.1rem; color: #eee; line-height: 1.6; margin: 0; max-width: 700px;
        }

        /* --- СЕТКА КНОПОК --- */
        .grid-row-3 {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 20px;
            width: 100%;
        }
        @media (min-width: 768px) {
            .grid-row-3 { grid-template-columns: repeat(3, 1fr); }
        }

        /* --- КНОПКИ КОНТАКТОВ --- */
        .action-card-contact {
            background: rgba(15, 10, 10, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(20px);

            padding: 15px 18px !important;
            min-height: 105px !important;

            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            justify-content: flex-start !important;

            text-align: left !important;
            text-decoration: none;
            transition: transform 0.3s ease, border-color 0.3s;

            /* Важно для прожектора */
            position: relative;
            overflow: hidden;
        }

        .action-icon-wrap-contacts {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            display: flex; align-items: center; justify-content: center;
            margin-right: 15px;
            flex-shrink: 0;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);

            /* Чтобы быть выше прожектора */
            position: relative;
            z-index: 1;
        }

        .contact-card-icon {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Контент кнопки поверх прожектора */
        .card-content {
            position: relative;
            z-index: 1;
        }

        /* Ховер эффекты */
        .action-card-contact:not(.disabled):hover {
            transform: translateY(-5px);
            border-color: #FF0000;
        }

        .action-card-contact:not(.disabled):hover .action-icon-wrap-contacts {
            border-color: #FF0000;
            background: rgba(255, 0, 0, 0.2);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
        }

        .action-card-contact:not(.disabled):hover .contact-card-icon {
            transform: rotate(360deg) scale(1.1);
        }

        /* Тексты */
        .action-card-contact h3 {
            font-size: 1.3rem !important; margin: 0 0 4px 0 !important; line-height: 1; color: #fff; font-weight: 900;
        }
        .action-card-contact p {
            font-size: 1.05rem !important; line-height: 1.3 !important; margin: 0 !important; opacity: 1; color: #fff;
        }

        /* Disabled state */
        .action-card-contact.disabled { opacity: 0.5; cursor: default; filter: grayscale(100%); }
        .action-card-contact.disabled:hover { transform: none !important; border-color: rgba(255, 255, 255, 0.1); }
        .action-card-contact.disabled:hover .action-icon-wrap-contacts { border-color: rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.05); box-shadow: none; }
        .action-card-contact.disabled:hover .contact-card-icon { transform: none; }
        /* Отключаем прожектор на disabled кнопке */
        .action-card-contact.disabled::before { display: none; }

        @media (max-width: 600px) {
            .sup-title-row { flex-direction: column; gap: 10px; text-align: center; }
            .sup-title { text-align: center; }
        }
    </style>
</head>
<body>

<div id="spotlight"></div>
<div class="bg-depth"></div>

<div class="container">

    <div id="header-container"></div>
    <div id="menu-container"></div>

    <div class="sup-card">
        <div class="sup-content-inner">
            <div class="sup-title-row">
                <div class="sup-main-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:100%; height:100%;">
                        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
                    </svg>
                </div>
                <h1 class="sup-title">Техническая поддержка</h1>
            </div>

            <p class="sup-text">
                Вся техническая поддержка производится с Божьей помощью! Но мы очень стараемся оперативно решать проблемы.<br>
                Выберите удобный способ связи:
            </p>
        </div>
    </div>

    <section class="grid-row-3">

        <a href="https://t.me/JanPro59" target="_blank" class="action-card-contact">
            <div class="action-icon-wrap-contacts">
                <img src="site/img/tg.svg" class="contact-card-icon" alt="Telegram">
            </div>
            <div class="card-content">
                <h3>Telegram</h3>
                <p>Для связи<br>напишите сюда</p>
            </div>
        </a>

        <a href="https://wa.me/79824699434" target="_blank" class="action-card-contact">
            <div class="action-icon-wrap-contacts">
                <img src="site/img/whatsapp.png" class="contact-card-icon" alt="WhatsApp">
            </div>
            <div class="card-content">
                <h3>WhatsApp</h3>
                <p>Или сюда<br></p>
            </div>
        </a>

        <a href="#" class="action-card-contact disabled" onclick="return false;">
            <div class="action-icon-wrap-contacts">
                <img src="site/img/max.png" class="contact-card-icon" alt="Max">
            </div>
            <div class="card-content">
                <h3>MAX</h3>
                <p>Сюда пока не пишите,<br>временно недоступно</p>
            </div>
        </a>

    </section>

    <div id="services-container" style="display: flex; flex-direction: column; gap: 20px;"></div>

    <div id="footer-container" style="margin-top: 20px;"></div>

</div>

<script>
    document.querySelectorAll('.sup-card, .action-card-contact').forEach(card => {
        card.onmousemove = e => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            card.style.setProperty('--mouse-x', `${x}px`);
            card.style.setProperty('--mouse-y', `${y}px`);
        };
    });
</script>

<script src="site/loader.js"></script>
<script>
    if(typeof initPage === 'function') {
        initPage('support');
    }
</script>

</body>
</html>
